name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
      - name: Record platform and tools
        run: |
          uname -sm
          bun --version
          node --version
          uv --version
      - run: bun install --frozen-lockfile
      - name: Install shell test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
          /bin/zsh --version
      - run: bun node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run check
